baseURL = "https://joeav01.github.io/"
title = "JoeAv's Blog"
theme = "PaperMod"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
enableGitInfo = true

[languages]
  [languages.zh]
    label = "中文"
    locale = "zh-CN"
    weight = 1

[params]
  mainSections = ["posts"]
  siteStartDate = "2026-08-12"
  githubURL = "https://github.com/JoeAv01/JoeAv01.github.io"
  [params.label]
    icon = "images/avatar.jpg"
    iconHeight = 32

[outputs]
  home = ["HTML", "RSS", "JSON"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.tableOfContents]
    startLevel = 3
    endLevel = 3
    ordered = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

[menus]
  [[menus.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menus.main]]
    name = "ZJU-Courses"
    url = "/zju-courses/"
    weight = 20
  [[menus.main]]
    name = "CSdiy"
    url = "/csdiy/"
    weight = 30
  [[menus.main]]
    name = "Friends"
    url = "/friends/"
    weight = 40
  [[menus.main]]
    name = "Search"
    identifier = "search"
    url = "/search/"
    weight = 50
