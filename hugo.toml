baseURL = "https://joeav01.github.io/"
title = "JoeAv's Blog"
theme = "PaperMod"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
enableGitInfo = true

[languages]
  [languages.zh]
    label = "中文"
    locale = "zh-CN"
    weight = 1

[params]
  mainSections = ["posts"]
  siteStartDate = "2026-08-12"
  [params.label]
    icon = "images/avatar.jpg"
    iconHeight = 32

[outputs]
  home = ["HTML", "RSS", "JSON"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.tableOfContents]
    startLevel = 3
    endLevel = 3
    ordered = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

[menus]
  [[menus.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menus.main]]
    name = "ZJU-Courses"
    url = "/zju-courses/"
    weight = 20
  [[menus.main]]
    name = "CSdiy"
    url = "/csdiy/"
    weight = 30
  [[menus.main]]
    name = "Friends"
    url = "/friends/"
    weight = 40
  [[menus.main]]
    name = "Search"
    identifier = "search"
    url = "/search/"
    weight = 50
  [[menus.main]]
    name = "GitHub"
    url = "https://github.com/JoeAv01/JoeAv01.github.io"
    pre = "<svg class=\"header-github-icon\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22\"></path></svg>"
    weight = 60
