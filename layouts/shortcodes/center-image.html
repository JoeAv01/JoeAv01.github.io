{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- with resources.Get $src -}}
<div class="center-image">
  <img src="{{ .RelPermalink }}" alt="{{ $alt }}" loading="lazy" decoding="async">
</div>
{{- else -}}
  {{- errorf "center-image shortcode could not find %q in assets: %s" $src .Position -}}
{{- end -}}
