{{- $pages := .Page.Pages.ByWeight -}}
{{- if $pages }}
<ul class="section-directory">
  {{- range $pages }}
    {{- $title := .LinkTitle -}}
    {{- if not .IsSection -}}
      {{- with .File }}{{ $title = .BaseFileName }}{{ end -}}
    {{- end }}
  <li><a href="{{ .RelPermalink }}">{{ $title }}</a></li>
  {{- end }}
</ul>
{{- else }}
<p class="section-directory__empty">暂无内容</p>
{{- end }}
