<div class="friends-grid">
  {{- with site.Data.friends }}
    {{- range . }}
      <article class="friend-card">
        <a class="friend-card__avatar-link" href="{{ .url }}" target="_blank" rel="noopener noreferrer" aria-label="访问 {{ .name }}">
          <img class="friend-card__avatar" src="{{ .avatar }}" alt="{{ .name }} 的头像" loading="lazy">
        </a>
        <div class="friend-card__content">
          <h2 class="friend-card__name">
            <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">{{ .name }}</a>
          </h2>
          <p class="friend-card__description">{{ .description }}</p>
        </div>
      </article>
    {{- end }}
  {{- else }}
    <p class="friends-grid__empty">暂无友链</p>
  {{- end }}
</div>
