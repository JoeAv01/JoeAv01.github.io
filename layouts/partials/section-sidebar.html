{{- $section := site.GetPage (printf "/%s" .Section) }}

<div class="section-sidebar-shell">
  <a class="section-sidebar__trigger" href="#section-navigation" aria-label="显示文章目录"></a>
  <aside class="section-sidebar" aria-label="{{ $section.Title }} 文章导航">
    <nav class="section-sidebar__nav" id="section-navigation">
      <a class="section-sidebar__title" href="{{ $section.RelPermalink }}">{{ $section.Title }}</a>
      {{- partial "section-sidebar-items.html" (dict "parent" $section "current" .) }}
    </nav>
  </aside>
</div>

<details class="section-mobile-nav">
  <summary>{{ $section.Title }} 文章导航</summary>
  {{- partial "section-sidebar-items.html" (dict "parent" $section "current" .) }}
</details>
